name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_details: bytes-size,percentage,lines
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html,css,scss,dockerfile,makefile,shell

      # Coding habits
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_habits: yes
          plugin_habits_from: 400
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

      # Recent activity
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14

      # Starred topics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.topics.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20
          plugin_topics_sort: stars

      # GitHub Skyline (heavy — own file)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.skyline.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_skyline: yes
          plugin_skyline_year: 2025
          plugin_skyline_frames: 6
          plugin_skyline_quality: 1
