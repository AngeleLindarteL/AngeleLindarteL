name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: lines,ratio
          plugin_languages_source: stars
          plugin_languages_indepth: yes
          plugin_languages_ignored: html,css,scss
          plugin_habits: yes
          plugin_habits_charts: activity
          plugin_habits_days: 14
          plugin_habits_from: 2008-01-01
          plugin_habits_plugin_activity: yes
          plugin_activity: yes
          config_timezone: America/Argentina/Buenos_Aires
          config_output: svg
          template: classic
