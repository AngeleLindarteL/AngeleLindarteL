name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Profile overview (header + contribution activity via GraphQL — not Events API)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          template: classic
          config_timezone: America/Argentina/Buenos_Aires

      # Languages (indepth)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_details: bytes-size,percentage,lines
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html,css,scss,dockerfile,makefile,shell

      # Isometric commit calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Lines of code
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.lines.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_lines: yes

      # Starred topics (labels — icons hide topics without icons)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.topics.svg
          base: ""
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 20
          plugin_topics_sort: stars
